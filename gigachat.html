<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreePythonCamp — Интерактивный курс Python</title>
    <style>
        :root {
            --bg-main: #1e1e1e;
            --bg-sidebar: #252526;
            --text-main: #cccccc;
            --text-muted: #9cdcfe;
            --accent: #007acc;
            --success: #4ec9b0;
            --error: #f44747;
            --border: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 250px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 1rem;
        }
        #sidebar h2 {
            font-size: 1.1rem;
            margin-top: 0;
            color: var(--accent);
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .module-title {
            font-weight: bold;
            color: var(--text-muted);
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .lesson-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .lesson-list li {
            margin-bottom: 0.3rem;
        }
        .lesson-list button {
            width: 100%;
            text-align: left;
            padding: 0.5rem;
            border: none;
            background: none;
            color: var(--text-main);
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .lesson-list button:hover {
            background-color: #333333;
        }
        .lesson-list button.completed {
            color: var(--success);
            font-weight: bold;
        }
        .lesson-list button.active {
            background-color: var(--accent);
            color: #000000;
        }
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #lesson-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            background-color: #2d2d30;
        }
        #lesson-title {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
        }
        #lesson-body {
            padding: 1.5rem;
            overflow-y: auto;
            flex-grow: 1;
            line-height: 1.6;
        }
        code {
            background-color: #333333;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            color: #ce9178;
        }
        pre {
            background-color: #1e1e1e;
            padding: 1rem;
            border-radius: 5px;
            overflow-x: auto;
            border: 1px solid var(--border);
        }
        #task-section {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
        #task-text {
            font-weight: 500;
            margin-bottom: 1rem;
        }
        #editor-container {
            display: flex;
            height: 200px;
            border: 1px solid var(--border);
            border-radius: 5px;
            overflow: hidden;
            background-color: #1e1e1e;
        }
        #code-input {
            width: 50%;
            height: 100%;
            border: none;
            padding: 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            background-color: #252526;
            color: #d4d4d4;
            resize: none;
            outline: none;
        }
        #output-panel {
            width: 50%;
            height: 100%;
            padding: 1rem;
            background-color: #000000;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            overflow-y: auto;
            border-left: 1px solid var(--border);
        }
        #controls {
            margin-top: 1rem;
            display: flex;
            gap: 1rem;
        }
        button {
            padding: 0.7rem 1.5rem;
            border: 1px solid var(--accent);
            background-color: var(--accent);
            color: #000000;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #005a9e;
        }
        button.check-btn {
            background-color: #4ec9b0;
            border-color: #4ec9b0;
        }
        button.check-btn:hover {
            background-color: #3a9982;
        }
        #result-message {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 4px;
            display: none;
        }
        #result-message.success {
            background-color: #203c20;
            color: #4ec9b0;
            border: 1px solid #4ec9b0;
        }
        #result-message.error {
            background-color: #3c2020;
            color: #f44747;
            border: 1px solid #f44747;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>FreePythonCamp</h2>
    <div class="module-title">Модуль 1: Основы</div>
    <ul class="lesson-list" id="module-1"></ul>

    <div class="module-title">Модуль 2: Структуры данных</div>
    <ul class="lesson-list" id="module-2"></ul>

    <div class="module-title">Модуль 3: Функции</div>
    <ul class="lesson-list" id="module-3"></ul>
</div>

<div id="main-content">
    <div id="lesson-header">
        <h1 id="lesson-title">Выберите урок</h1>
    </div>
    <div id="lesson-body">
        <p>Программа курса загружается...</p>
    </div>
</div>

<script>
// === БАЗА ДАННЫХ КУРСА ===
const courseData = [
    {
        id: 1,
        title: "Привет, мир!",
        content: "<p>Первая программа на любом языке — это вывод текста на экран. В Python для этого используется функция <code>print()</code>.</p><pre>print('Привет, мир!')</pre>",
        task: "Выведите на экран строку 'Я изучаю Python на FreePythonCamp'.",
        solution: "print('Я изучаю Python на FreePythonCamp')",
        initialCode: "print('Здесь будет ваш код')"
    },
    {
        id: 2,
        title: "Переменные и типы данных",
        content: "<p>Переменные хранят данные. Основные типы: <code>int</code> (целые числа), <code>float</code> (дробные), <code>str</code> (строки).</p><pre>age = 25\nprice = 19.99\nname = 'Алексей'</pre>",
        task: "Создайте переменную <code>city</code> со значением 'Москва' и выведите её на экран.",
        solution: "city = 'Москва'\nprint(city)",
        initialCode: "# Создайте переменную city здесь"
    },
    {
        id: 3,
        title: "Условный оператор if",
        content: "<p>Оператор <code>if</code> позволяет выполнять код при выполнении условия.</p><pre>num = 10\nif num > 5:\n    print('Число больше пяти')</pre>",
        task: "Если переменная <code>age</code> больше или равна 18, выведите 'Доступ разрешен'.",
        solution: "age = 20\nif age >= 18:\n    print('Доступ разрешен')",
        initialCode: "age = 15\n# Напишите условие здесь"
    },
    {
        id: 4,
        title: "Списки (Lists)",
        content: "<p>Список — это упорядоченная изменяемая коллекция. Создается в квадратных скобках.</p><pre>fruits = ['яблоко', 'банан', 'груша']\nprint(fruits[0]) # яблоко</pre>",
        task: "Создайте список <code>numbers</code> с числами 1, 2, 3 и выведите второй элемент.",
        solution: "numbers = [1, 2, 3]\nprint(numbers[1])",
        initialCode: "# Создайте список numbers здесь"
    },
    {
        id: 5,
        title: "Цикл for",
        content: "<p>Цикл <code>for</code> используется для перебора элементов.</p><pre>for i in range(3):\n    print(i) # 0 1 2</pre>",
        task: "Выведите на экран числа от 0 до 4 включительно.",
        solution: "for i in range(5):\n    print(i)",
        initialCode: "# Выведите числа от 0 до 4"
    },
    {
        id: 6,
        title: "Словари (Dictionaries)",
        content: "<p>Словарь хранит пары Ключ:Значение. Создается в фигурных скобках.</p><pre>user = {'name': 'Иван', 'age': 30}\nprint(user['name'])</pre>",
        task: "Создайте словарь <code>product</code> с ключами 'title' и 'price'. Выведите название.",
        solution: "product = {'title': 'Книга', 'price': 500}\nprint(product['title'])",
        initialCode: "# Создайте словарь product"
    },
    {
        id: 7,
        title: "Функции (def)",
        content: "<p>Функции позволяют переиспользовать код. Определяются через <code>def</code>.</p><pre>def greet(name):\n    print('Привет, ' + name)\n\ngreet('Петр')</pre>",
        task: "Создайте функцию <code>add</code>, которая принимает два числа и выводит их сумму.",
        solution: "def add(a, b):\n    print(a + b)\n\nadd(5, 10)",
        initialCode: "# Создайте функцию add здесь"
    },
    {
        id: 8,
        title: "Возврат значения (return)",
        content: "<p>Функция может не только выводить, но и возвращать результат для дальнейшей работы.</p><pre>def square(x):\n    return x * x\n\nresult = square(5)\nprint(result) # 25</pre>",
        task: "Создайте функцию <code>multiply</code>, которая возвращает произведение двух чисел.",
        solution: "def multiply(a, b):\n    return a * b\n\nprint(multiply(4, 5))",
        initialCode: "# Создайте функцию multiply"
    },
    {
        id: 9,
        title: "Обработка исключений (try/except)",
        content: "<p>Чтобы программа не падала при ошибках, используется <code>try/except</code>.</p><pre>try:\n    x = int('abc')\nexcept ValueError:\n    print('Ошибка ввода')</pre>",
        task: "Превратите ввод пользователя в число. Если ввод не число, выведите 'Это не число!'",
        solution: "user_input = input()\ntry:\n    num = int(user_input)\n    print(num)\nexcept ValueError:\n    print('Это не число!')",
        initialCode: "# Обработайте ввод пользователя"
    },
    {
        id: 10,
        title: "Чтение файлов",
        content: "<p>Для работы с файлами используется функция <code>open()</code> и менеджер контекста <code>with</code>.</p><pre>with open('data.txt', 'r') as f:\n    content = f.read()\nprint(content)</pre>",
        task: "Прочитайте файл 'lesson.txt' и выведите его содержимое. (В веб-среде это вызовет ошибку, так как нет доступа к ФС, просто напишите код правильно)",
        solution: "with open('lesson.txt', 'r', encoding='utf-8') as f:\n    data = f.read()\nprint(data)",
        initialCode: "# Прочитайте файл lesson.txt"
    }
];

// === ЛОГИКА ПРИЛОЖЕНИЯ ===
const sidebar = document.getElementById('sidebar');
const lessonTitle = document.getElementById('lesson-title');
const lessonBody = document.getElementById('lesson-body');
const codeInput = document.getElementById('code-input');
const outputPanel = document.getElementById('output-panel');
const resultMessage = document.createElement('div');
resultMessage.id = 'result-message';
lessonBody.appendChild(resultMessage);

let currentLessonId = null;

// Загрузка прогресса
function loadProgress() {
    return JSON.parse(localStorage.getItem('pythonCampProgress')) || {};
}
const progress = loadProgress();

// Отрисовка сайдбара
function renderSidebar() {
    [1, 2, 3].forEach(moduleId => {
        const container = document.getElementById(`module-${moduleId}`);
        container.innerHTML = '';
        const lessonsInModule = courseData.filter(l => Math.floor((l.id - 1) / 4) + 1 === moduleId);
        
        lessonsInModule.forEach(lesson => {
            const btn = document.createElement('button');
            btn.textContent = lesson.title;
            if (progress[lesson.id]) {
                btn.classList.add('completed');
                btn.innerHTML += ' ✓';
            }
            if (currentLessonId === lesson.id) {
                btn.classList.add('active');
            }
            btn.onclick = () => loadLesson(lesson.id);
            container.appendChild(btn);
        });
    });
}

// Загрузка урока
function loadLesson(id) {
    currentLessonId = id;
    const lesson = courseData.find(l => l.id === id);
    
    lessonTitle.textContent = lesson.title;
    lessonBody.innerHTML = lesson.content + '<div id="task-section"><h3>Задание:</h3><p id="task-text">' + lesson.task + '</p></div>';
    codeInput.value = lesson.initialCode;
    outputPanel.innerHTML = '';
    resultMessage.style.display = 'none';
    
    renderSidebar();
    // Сохраняем последнюю открытую позицию
    localStorage.setItem('pythonCampLastLesson', id);
}

// Проверка кода
function checkCode() {
    const lesson = courseData.find(l => l.id === currentLessonId);
    const userCode = codeInput.value;
    
    // Очищаем консоль
    outputPanel.innerHTML = '';
    resultMessage.style.display = 'none';

    // Создаем изолированный контекст
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    
    const iframeWindow = iframe.contentWindow;
    const iframeDocument = iframe.contentDocument;
    
    // Перехватываем print
    const consoleElement = document.createElement('pre');
    consoleElement.style.whiteSpace = 'pre-wrap';
    outputPanel.appendChild(consoleElement);
    
    iframeWindow.print = function(text) {
        consoleElement.textContent += text + '\n';
    };
    
    // Для урока 9 нужен input
    if (lesson.id === 9) {
        iframeWindow.input = function() {
            return "не_число";
        };
    }

    try {
        // Выполняем решение (эталон)
        iframeWindow.eval(lesson.solution);
        const expectedOutput = consoleElement.textContent;
        
        // Очищаем для пользовательского кода
        consoleElement.textContent = '';
        
        // Выполняем код пользователя
        iframeWindow.eval(userCode);
        const userOutput = consoleElement.textContent.trim();
        const expectedClean = expectedOutput.trim();

        if (userOutput === expectedClean) {
            resultMessage.className = 'success';
            resultMessage.textContent = 'Отлично! Задание выполнено верно.';
            resultMessage.style.display = 'block';
            
            // Помечаем как пройденное
            progress[lesson.id] = true;
            localStorage.setItem('pythonCampProgress', JSON.stringify(progress));
            renderSidebar();
        } else {
            resultMessage.className = 'error';
            resultMessage.textContent = 'Что-то не так. Ваш вывод:\n' + userOutput + '\n\nОжидалось:\n' + expectedClean;
            resultMessage.style.display = 'block';
        }
    } catch (e) {
        resultMessage.className = 'error';
        resultMessage.textContent = 'Ошибка в вашем коде:\n' + e.message;
        resultMessage.style.display = 'block';
    } finally {
        document.body.removeChild(iframe);
    }
}

// === ИНИЦИАЛИЗАЦИЯ ===
document.getElementById('controls').innerHTML = '<button class="check-btn" onclick="checkCode()">Проверить решение</button>';

// Загрузка последнего урока или первого
const lastLesson = localStorage.getItem('pythonCampLastLesson');
if (lastLesson) {
    loadLesson(parseInt(lastLesson));
} else {
    loadLesson(1);
}
renderSidebar();
</script>

</body>
</html>
