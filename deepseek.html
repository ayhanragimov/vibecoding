<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Интерактивный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0e14;
  --panel: #121821;
  --panel2: #1a2230;
  --border: #253040;
  --text: #e6edf3;
  --muted: #8b98a9;
  --accent: #4ade80;
  --accent2: #22d3ee;
  --warn: #fbbf24;
  --err: #f87171;
}
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}
.layout {
  display: grid;
  grid-template-columns: 300px 1fr;
  height: 100vh;
}
/* SIDEBAR */
.sidebar {
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.logo {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: bold;
  color: #000;
}
.logo h1 { font-size: 18px; font-weight: 600; }
.logo h1 span { color: var(--accent); }
.progress-bar {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}
.progress-bar .label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
}
.progress-track {
  height: 6px;
  background: var(--panel2);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  width: 0%;
  transition: width .4s;
}
.modules { flex: 1; padding: 10px 0; }
.module {
  padding: 10px 20px 4px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  font-weight: 600;
}
.lesson-item {
  padding: 10px 20px;
  font-size: 13.5px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  border-left: 3px solid transparent;
  transition: background .15s;
}
.lesson-item:hover { background: var(--panel2); }
.lesson-item.active {
  background: var(--panel2);
  border-left-color: var(--accent);
  color: var(--accent);
}
.lesson-item .check {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  display: grid;
  place-items: center;
  font-size: 10px;
  flex-shrink: 0;
}
.lesson-item.done .check {
  background: var(--accent);
  border-color: var(--accent);
  color: #000;
}
/* MAIN */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.topbar {
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.topbar .title { font-size: 15px; font-weight: 600; }
.topbar .actions { display: flex; gap: 10px; }
.btn {
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: .15s;
  font-family: inherit;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  font-weight: 600;
}
.btn.primary:hover { background: #3bc76e; color: #000; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
}
.education {
  overflow-y: auto;
  padding: 28px 32px;
  border-right: 1px solid var(--border);
}
.education h2 {
  font-size: 22px;
  margin-bottom: 16px;
  color: var(--accent);
}
.education h3 {
  font-size: 16px;
  margin: 20px 0 10px;
  color: var(--accent2);
}
.education p {
  line-height: 1.7;
  color: #c5cfdb;
  margin-bottom: 14px;
  font-size: 14.5px;
}
.education ul, .education ol {
  margin: 0 0 14px 22px;
  line-height: 1.8;
  color: #c5cfdb;
  font-size: 14.5px;
}
.education code.inline {
  background: var(--panel2);
  padding: 2px 7px;
  border-radius: 5px;
  font-family: 'Consolas', 'Monaco', monospace;
  color: var(--warn);
  font-size: 13px;
}
.education pre {
  background: #0d1117;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  overflow-x: auto;
  margin-bottom: 16px;
}
.education pre code {
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 13.5px;
  line-height: 1.6;
  color: #c9d1d9;
}
.kw { color: #ff7b72; }
.fn { color: #d2a8ff; }
.str { color: #a5d6ff; }
.num { color: #79c0ff; }
.com { color: #6e7681; font-style: italic; }
.note {
  background: rgba(34,211,238,.08);
  border-left: 3px solid var(--accent2);
  padding: 12px 16px;
  border-radius: 0 8px 8px 0;
  margin-bottom: 16px;
  font-size: 14px;
  color: #c5cfdb;
}
.task {
  background: rgba(74,222,128,.07);
  border: 1px solid rgba(74,222,128,.3);
  padding: 16px;
  border-radius: 10px;
  margin-top: 20px;
}
.task h3 { margin-top: 0; color: var(--accent); }
.task p { margin-bottom: 8px; }
/* EDITOR */
.editor-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #0d1117;
}
.editor-header {
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
  flex-shrink: 0;
}
.dots { display: flex; gap: 6px; margin-right: 10px; }
.dot { width: 11px; height: 11px; border-radius: 50%; }
.dot.r { background: #ff5f56; }
.dot.y { background: #ffbd2e; }
.dot.g { background: #27c93f; }
#editor {
  flex: 1;
  background: #0d1117;
  color: #e6edf3;
  border: none;
  outline: none;
  resize: none;
  padding: 18px;
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 14px;
  line-height: 1.6;
  tab-size: 4;
  overflow-y: auto;
}
.output-wrap {
  height: 200px;
  border-top: 1px solid var(--border);
  background: var(--panel);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.output-header {
  padding: 8px 16px;
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#output {
  flex: 1;
  padding: 14px 16px;
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 13px;
  line-height: 1.5;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
#output .success { color: var(--accent); }
#output .error { color: var(--err); }
#output .info { color: var(--muted); }
#output .warn { color: var(--warn); }
/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  display: none;
  place-items: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
.modal-overlay.show { display: grid; }
.modal {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  max-width: 440px;
  text-align: center;
  animation: pop .3s;
}
@keyframes pop {
  from { transform: scale(.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.modal .emoji { font-size: 52px; margin-bottom: 12px; }
.modal h2 { color: var(--accent); margin-bottom: 10px; font-size: 22px; }
.modal p { color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: grid;
  place-items: center;
  z-index: 200;
  transition: opacity .5s;
}
.loading-screen.hide { opacity: 0; pointer-events: none; }
.spinner {
  width: 44px; height: 44px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-screen p { color: var(--muted); font-size: 14px; text-align: center; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #35455c; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: -300px; z-index: 50; height: 100%; transition: left .3s; }
  .sidebar.open { left: 0; }
  .workspace { grid-template-columns: 1fr; }
  .education { display: none; }
  .education.show { display: block; position: absolute; inset: 0; background: var(--bg); z-index: 10; }
  .menu-btn { display: block !important; }
}
.menu-btn { display: none; background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; }
</style>
</head>
<body>

<div class="loading-screen" id="loader">
  <div>
    <div class="spinner"></div>
    <p>Загрузка Python-окружения...<br><span style="font-size:12px">Первый запуск может занять 10-20 секунд</span></p>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-icon">Py</div>
      <h1>Py<span>Camp</span></h1>
    </div>
    <div class="progress-bar">
      <div class="label"><span>Прогресс</span><span id="progressText">0 / 0</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <nav class="modules" id="lessonsNav"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div class="title" id="lessonTitle">Загрузка...</div>
      <div class="actions">
        <button class="btn" id="btnSolution">Показать решение</button>
        <button class="btn" id="btnReset">Сбросить</button>
        <button class="btn primary" id="btnRun">▶ Запустить</button>
      </div>
    </div>

    <div class="workspace">
      <section class="education" id="education"></section>
      <section class="editor-panel">
        <div class="editor-header">
          <div class="dots"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
          <span>main.py</span>
        </div>
        <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        <div class="output-wrap">
          <div class="output-header">
            <span>Консоль</span>
            <span id="runStatus"></span>
          </div>
          <div id="output"><span class="info">Нажмите «Запустить», чтобы выполнить код.</span></div>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="emoji" id="modalEmoji">🎉</div>
    <h2 id="modalTitle">Отлично!</h2>
    <p id="modalText"></p>
    <button class="btn primary" id="modalBtn">Продолжить</button>
  </div>
</div>

<script>
// ============ КУРС ============
const COURSE = [
  {
    module: "Основы",
    lessons: [
      {
        id: "intro",
        title: "Привет, Python!",
        theory: `
          <h2>Знакомство с Python</h2>
          <p>Python — это популярный язык программирования, известный своей простотой и читаемостью. Он используется в веб-разработке, анализе данных, машинном обучении и автоматизации.</p>
          <h3>Функция print()</h3>
          <p>Чтобы вывести что-то на экран, используется функция <code class="inline">print()</code>:</p>
          <pre><code><span class="fn">print</span>(<span class="str">"Привет, мир!"</span>)</code></pre>
          <p>Текст в кавычках называется <b>строкой</b>. Можно использовать одинарные или двойные кавычки.</p>
          <div class="note">💡 Каждая команда в Python пишется с новой строки. Отступы важны!</div>
          <div class="task">
            <h3>📝 Задание</h3>
            <p>Выведите на экран текст: <code class="inline">Привет, Python!</code></p>
          </div>
        `,
        initial: `# Ваш код здесь\n# Подсказка: используйте print()\n`,
        solution: `print("Привет, Python!")`,
        check: (out) => out.trim() === "Привет, Python!"
      },
      {
        id: "vars",
        title: "Переменные и типы",
        theory: `
          <h2>Переменные</h2>
          <p><b>Переменная</b> — это именованная ячейка памяти для хранения данных. В Python не нужно указывать тип явно:</p>
          <pre><code>name = <span class="str">"Анна"</span>     <span class="com"># строка (str)</span>
age = <span class="num">25</span>            <span class="com"># целое число (int)</span>
height = <span class="num">1.68</span>        <span class="com"># дробное число (float)</span>
is_student = <span class="kw">True</span>   <span class="com"># логический (bool)</span></code></pre>
          <h3>Основные типы</h3>
          <ul>
            <li><code class="inline">str</code> — строки: <code class="inline">"текст"</code></li>
            <li><code class="inline">int</code> — целые числа: <code class="inline">42</code></li>
            <li><code class="inline">float</code> — дробные: <code class="inline">3.14</code></li>
            <li><code class="inline">bool</code> — True / False</li>
          </ul>
          <p>Функция <code class="inline">type()</code> показывает тип значения:</p>
          <pre><code><span class="fn">print</span>(<span class="fn">type</span>(<span class="num">5</span>))       <span class="com"># &lt;class 'int'&gt;</span>
<span class="fn">print</span>(<span class="fn">type</span>(<span class="str">"hi"</span>))    <span class="com"># &lt;class 'str'&gt;</span></code></pre>
          <div class="task">
            <h3>📝 Задание</h3>
            <p>Создайте переменную <code class="inline">x = 10</code>, переменную <code class="inline">y = 20</code> и выведите их сумму.</p>
          </div>
        `,
        initial: `# Создайте переменные и выведите сумму\n`,
        solution: `x = 10\ny = 20\nprint(x + y)`,
        check: (out) => out.trim() === "30"
      },
      {
        id: "math",
        title: "Математика",
        theory: `
          <h2>Арифметические операции</h2>
          <pre><code><span class="fn">print</span>(<span class="num">7</span> + <span class="num">3</span>)   <span class="com"># 10  сложение</span>
<span class="fn">print</span>(<span class="num">7</span> - <span class="num">3</span>)   <span class="com"># 4   вычитание</span>
<span class="fn">print</span>(<span class="num">7</span> * <span class="num">3</span>)   <span class="com"># 21  умножение</span>
<span class="fn">print</span>(<span class="num">7</span> / <span class="num">3</span>)   <span class="com"># 2.33... деление</span>
<span class="fn">print</span>(<span class="num">7</span> // <span class="num">3</span>)  <span class="com"># 2   целочисленное деление</span>
<span class="fn">print</span>(<span class="num">7</span> % <span class="num">3</span>)   <span class="com"># 1   остаток</span>
<span class="fn">print</span>(<span class="num">2</span> ** <span class="num">3</span>)  <span class="com"># 8   возведение в степень</span></code></pre>
          <p>Скобки работают как в математике: <code class="inline">(2 + 3) * 4 = 20</code>.</p>
          <div class="task">
            <h3>📝 Задание</h3>
            <p>Выведите результат выражения: <code class="inline">(15 + 5) * 2 - 10</code></p>
          </div>
        `,
        initial: `# Вычислите (15 + 5) * 2 - 10\n`,
        solution: `print((15 + 5) * 2 - 10)`,
        check: (out) => out.trim() === "30"
      },
      {
        id: "strings",
        title: "Строки",
        theory: `
          <h2>Работа со строками</h2>
          <p>Строки можно складывать (конкатенация) и умножать:</p>
          <pre><code><span class="fn">print</span>(<span class="str">"Py"</span> + <span class="str">"thon"</span>)   <span class="com"># Python</span>
<span class="fn">print</span>(<span class="str">"ab"</span> * <span class="num">3</span>)         <span class="com"># ababab</span></code></pre>
          <h3>F-строки</h3>
          <p>Самый удобный способ вставить переменные в текст:</p>
          <pre><code>name = <span class="str">"Мир"</span>
<span class="fn">print</span>(<span class="str">f"Привет, {name}!"</span>)   <span class="com"># Привет, Мир!</span></code></pre>
          <h3>Полезные методы</h3>
          <pre><code>s = <span class="str">"hello"</span>
<span class="fn">print</span>(s.<span class="fn">upper</span>())    <span class="com"># HELLO</span>
<span class="fn">print</span>(s.<span class="fn">capitalize</span>()) <span class="com"># Hello</span>
<span class="fn">print</span>(<span class="fn">len</span>(s))         <span class="com"># 5</span></code></pre>
          <div class="task">
            <h3>📝 Задание</h3>
            <p>Создайте переменную <code class="inline">name = "Python"</code> и выведите строку <code class="inline">Я изучаю Python!</code> используя f-строку.</p>
          </div>
        `,
        initial: `# Создайте переменную и f-строку\n`,
        solution: `name = "Python"\nprint(f"Я изучаю {name}!")`,
        check: (out) => out.trim() === "Я изучаю Python!"
      },
      {
        id: "input",
        title: "Ввод данных",
        theory: `
          <h2>Функция input()</h2>
          <p><code class="inline">input()</code> читает строку, введённую пользователем:</p>
          <pre><code>name = <span class="fn">input</span>(<span class="str">"Как вас зовут? "</span>)
<span class="fn">print</span>(<span class="str">f"Привет, {name}!"</span>)</code></pre>
          <div class="note">⚠️ Для этого урока мы эмулируем ввод: считайте, что пользователь ввёл <b>"Иван"</b>. Используйте переменную вместо input().</div>
          <div class="task">
            <h3>📝 Задание</h3>
            <p>Создайте переменную <code class="inline">user = "Иван"</code> и выведите <code class="inline">Привет, Иван!</code></p>
          </div>
        `,
        initial: `# Создайте переменную user = "Иван"\n`,
        solution: `user = "Иван"\nprint(f"Привет, {user}!")`,
        check: (out) => out.trim() === "Привет, Иван!"
      }
    ]
  },
  {
    module: "Управление потоком",
    lessons: [
      {
        id: "if",
        title: "Условия if / else",
        theory: `
          <h2>Условные конструкции</h2>
          <p>Оператор <code class="inline">if</code> выполняет код, только если условие истинно:</p>
          <pre><code>age = <span class="num">18</span>
<span class="kw">if</span> age &gt;= <span class="num">18</span>:
    <span class="fn">print</span>(<span class="str">"Совершеннолетний"</span>)
<span class="kw">else</span>:
    <span class="fn">print</span>(<span class="str">"Ребёнок"</span>)</code></pre>
          <h3>Операторы сравнения</h3>
          <ul>
            <li><code class="inline">==</code> — равно</li>
            <li><code class="inline">!=</code> — не равно</li>
            <li><code class="inline">&gt;</code>, <code class="inline">&lt;</code>, <code class="inline">&gt;=</code>, <code class="inline">&lt;=</code></li>
          </ul>
          <h3>elif</h3>
          <pre><code>score = <span class="num">75</span>
<span class="kw">if</span> score &gt;= <span class="num">90</span>:
    <span class="fn">print</span>(<span class="str">"A"</span>)
<span class="kw">elif</span> score &gt;= <span class="num">70</span>:
    <span class="fn">print</span>(<span class="str">"B"</span>)
<span class="kw">else</span>:
    <span class="fn">print</span>(<span class="str">"C"</span>)</code></pre>
